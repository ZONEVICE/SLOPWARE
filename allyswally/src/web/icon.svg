<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AllySwally">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#b3151b"/>
    </linearGradient>
  </defs>
  <!-- Horns -->
  <path d="M16 15 C 10 4, 3 3, 2 2 C 6 8, 7 14, 14 19 Z" fill="#8c0f14"/>
  <path d="M48 15 C 54 4, 61 3, 62 2 C 58 8, 57 14, 50 19 Z" fill="#8c0f14"/>
  <!-- Handheld body -->
  <rect x="8" y="14" width="48" height="40" rx="12" fill="url(#body)" stroke="#7a0d11" stroke-width="2"/>
  <!-- Screen -->
  <rect x="20" y="20" width="24" height="18" rx="3" fill="#120406"/>
  <rect x="22" y="22" width="20" height="14" rx="2" fill="#2bd4c4" opacity="0.85"/>
  <!-- D-pad -->
  <g fill="#390406">
    <rect x="12.5" y="42" width="9" height="3" rx="1.5"/>
    <rect x="15.5" y="39" width="3" height="9" rx="1.5"/>
  </g>
  <!-- Buttons -->
  <circle cx="45" cy="42" r="2.4" fill="#390406"/>
  <circle cx="50" cy="46" r="2.4" fill="#390406"/>
  <!-- Eyes on the screen to echo the mischievous theme -->
  <circle cx="29" cy="29" r="2" fill="#120406"/>
  <circle cx="35" cy="29" r="2" fill="#120406"/>
</svg>
