<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#fafbf8">
    <meta name="description" content="A local-first workspace for organizing and queuing conversations with your Ollama models.">
    <title>Guanaco — Your local AI workspace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23166055'/%3E%3Cpath d='M18 43V30l7-3V14l5 5 4-6 4 6v14l9 6v10h-6v-7l-11-5-6 2v10h-6z' fill='%23f4f4de'/%3E%3Ccircle cx='33' cy='24' r='2' fill='%23166055'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to workspace</a>
    <!-- The shell is deliberately static. View modules own only their section's
         contents, so new views can be added without changing application state. -->
    <div id="app-shell" class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="#orchestrator" aria-label="Guanaco home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44" fill="none"><path d="M10 33V23l7-3V8l4 4 4-5 4 6v13l7 4v7h-5v-5l-11-5-5 3v7h-5Z" fill="currentColor"/><circle cx="24" cy="18" r="1.7" fill="#166055"/></svg>
          </span>
          <span class="brand-name">guanaco<span class="brand-caption">LOCAL AI WORKSPACE</span></span>
        </a>

        <p class="nav-label">WORKSPACE</p>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="#orchestrator" data-nav="orchestrator" class="nav-link active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="6" height="6" rx="1.5"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.5"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.5"/><rect x="14.5" y="14.5" width="6" height="6" rx="1.5"/></svg>
            <span>Orchestrator</span><span class="nav-active-dot" aria-hidden="true"></span>
          </a>
          <a href="#chat" data-nav="chat" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-8.5 8.5 9.2 9.2 0 0 1-3.7-.8L3.5 20.5l1.3-4.8a9.2 9.2 0 0 1-.8-3.7 8.5 8.5 0 0 1 8.5-8.5h.5a8 8 0 0 1 7.5 8Z"/><path d="M8 10h8M8 14h5"/></svg>
            <span>Chat</span><span class="nav-active-dot" aria-hidden="true"></span>
          </a>
          <a href="#settings" data-nav="settings" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h7m5 0h4M4 17h3m5 0h8"/><circle cx="13.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></svg>
            <span>Configuration</span><span class="nav-active-dot" aria-hidden="true"></span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="local-panel">
            <span class="local-panel-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m12 3 8 3v5c0 5-4 8-8 10-4-2-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>
            <p>Your models.<br>Your workspace.</p>
            <span>Direct to Ollama. Stored in your browser.</span>
          </div>
          <div class="server-status" role="status">
            <span id="connection-indicator" class="connection-dot" aria-hidden="true"></span>
            <div><span id="connection-label">Not connected</span><span id="server-label" class="server-address">Configure your server</span></div>
          </div>
          <div class="sidebar-footer"><span>GUANACO</span><span>LOCAL FIRST <span aria-hidden="true">↗</span></span></div>
        </div>
      </aside>

      <main id="main" class="main-content" tabindex="-1">
        <section id="orchestrator-view" class="view" aria-label="Request orchestrator"></section>
        <section id="chat-view" class="view" aria-label="Chat" hidden></section>
        <section id="settings-view" class="view" aria-label="Global configuration" hidden></section>
        <noscript><div class="notice error">JavaScript is required to connect to Ollama and manage the request queue. Please enable it in your browser.</div></noscript>
      </main>
    </div>

    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
    <dialog id="config-dialog" class="dialog-wide" aria-label="Conversation configuration"></dialog>
    <dialog id="confirm-dialog" aria-label="Confirm action"></dialog>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
