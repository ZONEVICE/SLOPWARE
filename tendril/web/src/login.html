<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>Tendril — log in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/assets/public/boot.js"></script>
<link rel="stylesheet" href="/assets/public/themes.css">
<link rel="stylesheet" href="/assets/public/login-style.css">
<script type="module" src="/assets/public/login.js"></script>
</head>
<body class="login-body">
<main class="login-card">
  <svg class="login-logo" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M3.6 14.6C3 10.4 4.8 6.7 8.8 5.7c2.3-.6 4 .9 3.6 2.7-.3 1.4-1.8 2-2.8 1.3-.8-.5-.6-1.7.3-1.8"/>
    <path class="fill" d="M6.7 6.3C5.5 4 6.4 1.8 9.1 1.4c.4 2.6-.6 4.4-2.4 4.9z"/>
  </svg>
  <h1 class="login-title">Tendril</h1>
  <p class="login-sub">Enter the password shown in the console where Tendril is running.</p>
  <form id="login-form" class="login-form" autocomplete="on">
    <label class="login-label" for="password">Password</label>
    <div class="login-field">
      <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      <button type="button" id="reveal" class="login-reveal" aria-label="Show password" title="Show password">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.75 6.5-4.75S14.5 8 14.5 8 12.1 12.75 8 12.75 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
      </button>
    </div>
    <button type="submit" id="submit" class="login-submit">Unlock</button>
    <p id="message" class="login-message" role="alert" aria-live="assertive"></p>
  </form>
  <div class="login-footer">
    <label class="login-theme-label" for="theme">Theme</label>
    <select id="theme" class="login-theme"></select>
  </div>
</main>
</body>
</html>
